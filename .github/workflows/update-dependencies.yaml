name: Update native dependencies

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-native-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install update tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq gh libdigest-sha-perl

      - name: Update dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make --no-print-directory -C versions | tee "$RUNNER_TEMP/dependency-updates.md"
          cat "$RUNNER_TEMP/dependency-updates.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-native-dependencies
          title: Update native dependencies
          commit-message: Update native dependency versions and SHA-256 sums
          body-path: ${{ runner.temp }}/dependency-updates.md
          add-paths: versions/*

      - name: Comment on updated pull request
        if: steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/dependency-updates.md"
