name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl jq libdigest-sha-perl

      - name: Install development dependencies
        run: |
          pip install --upgrade pip
          pip install --group dev

      - name: Lint sources and tests
        run: make lint

      - name: Run unit tests
        run: make test
