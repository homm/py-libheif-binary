name: Linux wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.base }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        base: [manylinux, musllinux]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build and test wheel
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: linux/Dockerfile
          target: wheel
          platforms: linux/${{ matrix.arch }}
          build-args: BASE=${{ matrix.base }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=linux-${{ matrix.base }}-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-${{ matrix.base }}-${{ matrix.arch }},mode=max

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/libheif_binary-*.whl
          if-no-files-found: error
