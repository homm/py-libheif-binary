name: Linux wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.base }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        base: [manylinux, musllinux]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Build and test wheel
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: make -C linux ${{ matrix.base }}

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/libheif_binary-*.whl
          if-no-files-found: error
