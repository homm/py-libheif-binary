[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libheif_binary"
dynamic = ["version"]
description = "Prebuilt libheif, codecs and command-line tools"
readme = "README.md"
requires-python = ">=3.6"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "pytest>=9.1.1",
]

[project.scripts]
heif-enc = "libheif_binary:heif_enc"
heif-dec = "libheif_binary:heif_dec"
heif-info = "libheif_binary:heif_info"
libheif-link-cli = "libheif_binary:link_cli"

[tool.setuptools]
packages = ["libheif_binary"]

[tool.setuptools.package-data]
libheif_binary = ["bin/*", "lib/*", "licenses/*", "include/libheif/*.h", "LIBVERSION"]

[tool.pytest.ini_options]
pythonpath = ["."]
